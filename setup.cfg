[metadata]
name = PyGCL
version = 0.1.2
author = Yanqiao Zhu
author_email = i@sxkdz.me
description = PyGCL: Graph Contrastive Learning for PyTorch
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/PyGCL/PyGCL
project_urls =
    Bug Tracker = https://github.com/PyGCL/PyGCL/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
keywords =
    PyTorch
    Graph-Neural-Networks
    Graph-Contrastive-Learning

[options]
package_dir =
    = .
packages = find:
python_requires = >= 3.10
install_requires =
    torch >= 2.0
    torch-geometric >= 2.5
    numpy
    tqdm
    scipy
    networkx
    scikit-learn

[options.extras_require]
dgl =
    dgl
sparse =
    torch-sparse
test =
    pytest
    coverage

[options.packages.find]
where = .
